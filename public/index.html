<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Genesys Media Bar (Embeddable Framework) — Minimal Embed</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: auto 1fr; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; }
    header { padding: 10px 14px; border-bottom: 1px solid #e5e7eb; background: #f8fafc; }
    .frame-wrap { height: 100%; }
    iframe { width: 100%; height: 100%; border: 0; }
    .hint { color: #475569; font-size: 14px; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
  </style>
  <!--
    Public deployment iframe URL. Replace the region host as appropriate for your org.
    Example regions: apps.usw2.pure.cloud, apps.euw2.pure.cloud, apps.apse2.pure.cloud, apps.apne2.pure.cloud

    For private deployments (custom framework.js uploaded in Admin > Integrations), the URL is generally the same.
    You may add query params such as dedicatedLoginWindow=true for separate login pop-up behavior.
  -->
</head>
<body>
  <header>
    <div><strong>Genesys Media Bar</strong> — Embeddable Framework</div>
    <div class="hint">Update the iframe <code>src</code> to your region. Default below uses <code>apps.euw2.pure.cloud</code>.</div>
  </header>
  <div class="frame-wrap">
    <iframe
      title="Genesys Embedded Client"
      src="https://apps.euw2.pure.cloud/crm/embeddableFramework.html?gcHost=apps.euw2.pure.cloud"
      allow="microphone; camera; autoplay; clipboard-read; clipboard-write; display-capture"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>
</body>
</html>
